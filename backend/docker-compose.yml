# /********************************************************************************
#  * [新增功能]: Docker Compose 多容器服务编排配置文件 (Docker Compose Orchestration)
#  * [应用场景]: 一键启动与编排 Node.js 后端应用、Redis 内存缓存与 Nginx 反向代理网关容器
#  ********************************************************************************/
version: '3.8'

services:
  # Goodbuck Node.js API 后端服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goodbuck_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - goodbuck_net

  # Redis 内存缓存数据库
  redis:
    image: redis:7-alpine
    container_name: goodbuck_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - goodbuck_net

  # Nginx 反向代理网关与负载均衡
  nginx:
    image: nginx:alpine
    container_name: goodbuck_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - goodbuck_net

networks:
  goodbuck_net:
    driver: bridge

volumes:
  redis_data:
# /********************************************************************************/
