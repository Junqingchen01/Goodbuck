# /********************************************************************************
#  * [新增功能]: Nginx 反向代理与 HTTP 网关配置文件 (Nginx Gateway & Load Balancer Config)
#  * [应用场景]: 实现生产环境 SSL 证书终止、负载均衡、Gzip报文压缩与流量防刷限制
#  ********************************************************************************/
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip 报文压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 后端 Node.js upstream 负载均衡集群
    upstream goodbuck_backend {
        server api:3000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Swagger API 文档代理
        location /api-docs {
            proxy_pass http://goodbuck_backend/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 后端 RESTful API 统一反向代理
        location / {
            proxy_pass http://goodbuck_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
# /********************************************************************************/
